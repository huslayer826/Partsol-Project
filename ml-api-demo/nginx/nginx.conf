worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$proxy_request_id';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    upstream api {
        server api:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # Forward an incoming X-Request-ID through to the backend if the client
    # supplied one; otherwise inject one from nginx's built-in $request_id so
    # every proxied request carries a traceable id.
    map $http_x_request_id $proxy_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $proxy_request_id;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
        }

        location /metrics {
            # TODO: in production, replace `deny all` with an IP allowlist for
            # the Prometheus scraper(s). For now /metrics is not exposed to the
            # outside world; internal scrapers should hit the api container
            # directly over the docker network.
            deny all;
            proxy_pass http://api/metrics;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Connection/Upgrade enable Next.js HMR (WebSocket) in dev mode
            # and are no-ops for production HTTP traffic.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
